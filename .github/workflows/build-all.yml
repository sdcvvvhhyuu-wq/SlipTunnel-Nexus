name: Build Android APK

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-core:
    name: Compile Native Cores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Toolchains
        run: |
          sudo apt-get update && sudo apt-get install -y golang-go
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          
      - name: Setup Zig & NDK
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Native Cores
        run: |
          cd rust_core && cargo ndk -t arm64-v8a --platform 24 build --release && cd ..
          cd zig_core && zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast && cd ..
          cd core
          export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -buildmode=c-shared -o libargotunnel_core.so main.go
          cd ..

      - name: Stage Artifacts
        run: |
          mkdir -p staging_artifacts/libs
          cp rust_core/target/aarch64-linux-android/release/libargotunnel_rust_core.so staging_artifacts/libs/
          cp core/libargotunnel_core.so staging_artifacts/libs/
          
      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: staging_artifacts/

  build-android:
    name: Build Android APK
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Native Libs
        uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: temp_libs/

      - name: Prepare Android Environment
        run: |
          # پیدا کردن خودکار ریشه پروژه اندروید
          ANDROID_ROOT=$(find . -maxdepth 3 -name "settings.gradle*" -exec dirname {} \;)
          echo "Android root located at: $ANDROID_ROOT"
          
          # تزریق آیکون‌ها
          mkdir -p $ANDROID_ROOT/app/src/main/res/drawable/ $ANDROID_ROOT/app/src/main/res/mipmap-anydpi-v26/
          echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:pathData="M 0,0 H 108 V 108 H 0 Z" android:fillColor="#000000" /></vector>' > $ANDROID_ROOT/app/src/main/res/drawable/ic_launcher_background.xml
          echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:pathData="M 54,30 L 74,66 H 34 Z" android:fillColor="#00E5FF" /></vector>' > $ANDROID_ROOT/app/src/main/res/drawable/ic_launcher_foreground.xml
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>' > $ANDROID_ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          # انتقال کتابخانه‌ها و تنظیم گریدل
          mkdir -p $ANDROID_ROOT/app/src/main/jniLibs/arm64-v8a/
          cp temp_libs/libs/* $ANDROID_ROOT/app/src/main/jniLibs/arm64-v8a/
          
          cd $ANDROID_ROOT
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          ANDROID_ROOT=$(find . -maxdepth 3 -name "settings.gradle*" -exec dirname {} \;)
          cd $ANDROID_ROOT
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: **/outputs/apk/release/*.apk
