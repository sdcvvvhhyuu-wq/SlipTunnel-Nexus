name: Build Android APK

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-core:
    name: Compile Go, Rust, and Zig Cores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Build Rust Core (aarch64)
        run: |
          cd rust_core
          cargo ndk -t arm64-v8a --platform 24 build --release

      - name: Build Zig Scrubber (aarch64)
        run: |
          cd zig_core
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast

      - name: Build Go Core (C-Shared)
        run: |
          cd core
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -buildmode=c-shared -o libargotunnel_core.so main.go

      - name: Stage Artifacts
        run: |
          mkdir -p staging_artifacts/libs
          mkdir -p staging_artifacts/headers
          cp rust_core/target/aarch64-linux-android/release/libargotunnel_rust_core.so staging_artifacts/libs/
          cp core/libargotunnel_core.so staging_artifacts/libs/
          cp core/libargotunnel_core.h staging_artifacts/headers/

      - name: Upload Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries
          path: staging_artifacts/

  build-android:
    name: Build Android APK
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Core Artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-libraries
          path: temp_native_artifacts/

      - name: Inject Adaptive Icon Resources
        run: |
          # ایجاد پوشه‌های لازم برای آیکون‌ها
          mkdir -p android/app/src/main/res/drawable/
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26/
          
          # این مرحله به صورت خودکار فایل‌های وکتور را ایجاد می‌کند تا خطای AAPT2 رفع شود
          echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:pathData="M 0,0 H 108 V 108 H 0 Z" android:fillColor="#000000" /></vector>' > android/app/src/main/res/drawable/ic_launcher_background.xml
          
          echo '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:pathData="M 54,30 L 74,66 H 34 Z" android:fillColor="#00E5FF" /></vector>' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          
          echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Distribute Native Artifacts
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a/
          cp -r temp_native_artifacts/libs/* android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-sliptunnel-nexus-release
          path: android/app/build/outputs/apk/release/*.apk
