Name: Nexus Omni-Build Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-core:
    name: Compile Go, Rust, and Zig Cores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Build Rust Core (aarch64)
        run: |
          cd rust_core
          cargo ndk -t arm64-v8a --platform 24 build --release

      - name: Build Zig Scrubber (aarch64)
        run: |
          cd zig_core
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast

      - name: Build Go Core (C-Shared)
        run: |
          cd core
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
          
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -buildmode=c-shared -o libargotunnel_core.so main.go

      - name: Stage Artifacts (Flatten Directory Structure)
        run: |
          mkdir -p staging_artifacts/libs
          mkdir -p staging_artifacts/headers
          cp rust_core/target/aarch64-linux-android/release/libargotunnel_rust_core.so staging_artifacts/libs/
          cp core/libargotunnel_core.so staging_artifacts/libs/
          cp core/libargotunnel_core.h staging_artifacts/headers/

      - name: Upload Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries
          path: staging_artifacts/

  build-android:
    name: Build Android APK
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Core Artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-libraries
          path: temp_native_artifacts/

      - name: Distribute Native Artifacts to Android Structure
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a/
          mkdir -p android/app/src/main/cpp/
          cp -r temp_native_artifacts/libs/* android/app/src/main/jniLibs/arm64-v8a/
          cp -r temp_native_artifacts/headers/* android/app/src/main/cpp/

      - name: Generate Root Gradle Configs Automatically
        run: |
          cd android
          
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SlipTunnel-Nexus"
          include(":app")
          EOF
          
          gradle wrapper --gradle-version 8.6

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-sliptunnel-nexus-release
          path: android/app/build/outputs/apk/release/*.apk
