name: Nexus Omni-Build Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-core:
    name: Compile Go, Rust, and Zig Cores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Build Rust Core (aarch64)
        run: |
          cd rust_core
          cargo ndk -t arm64-v8a --platform 24 build --release

      - name: Build Zig Scrubber (aarch64)
        run: |
          cd zig_core
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast

      - name: Build Go Core (C-Shared)
        run: |
          cd core
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -buildmode=c-shared -o libargotunnel_core.so main.go

      - name: Stage Artifacts (Flatten Directory Structure)
        run: |
          mkdir -p staging_artifacts
          cp rust_core/target/aarch64-linux-android/release/libargotunnel_rust_core.so staging_artifacts/
          cp core/libargotunnel_core.so staging_artifacts/
          cp core/libargotunnel_core.h staging_artifacts/

      - name: Upload Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries
          path: staging_artifacts/

  build-android:
    name: Build Android APK
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Download Core Artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-libraries
          path: android/app/src/main/jniLibs/arm64-v8a/

      - name: Generate Android Resources
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/xml

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:pathData="M 0,0 H 108 V 108 H 0 Z" android:fillColor="#000000"/></vector>' \
            > android/app/src/main/res/drawable/ic_launcher_background.xml

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:pathData="M 54,30 L 74,66 H 34 Z" android:fillColor="#00E5FF"/></vector>' \
            > android/app/src/main/res/drawable/ic_launcher_foreground.xml

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>' \
            > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>' \
            > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><exclude domain="root" path="."/></cloud-backup><device-transfer><exclude domain="root" path="."/></device-transfer></data-extraction-rules>' \
            > android/app/src/main/res/xml/data_extraction_rules.xml

      - name: Generate pubspec.yaml if missing
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            python3 -c "
          lines = [
              'name: sliptunnel_nexus',
              'description: SlipTunnel Nexus - Advanced VPN Application',
              'version: 1.4.0+1',
              'environment:',
              '  sdk: \">=3.0.0 <4.0.0\"',
              '  flutter: \">=3.10.0\"',
              'dependencies:',
              '  flutter:',
              '    sdk: flutter',
              'dev_dependencies:',
              '  flutter_test:',
              '    sdk: flutter',
              'flutter:',
              '  uses-material-design: true',
          ]
          open('pubspec.yaml', 'w').write('\n'.join(lines) + '\n')
          "
          fi

      # Flutter requires lib/main.dart to exist. Only created if absent so existing
      # app source is never overwritten.
      - name: Generate lib/main.dart if missing
        run: |
          if [ ! -f "lib/main.dart" ]; then
            mkdir -p lib
            cat > lib/main.dart << 'DART_EOF'
import 'package:flutter/material.dart';

void main() {
  runApp(const SlipTunnelApp());
}

class SlipTunnelApp extends StatelessWidget {
  const SlipTunnelApp({super.key});

  @override
  Widget build(BuildContext context) {
    return const MaterialApp(
      title: 'SlipTunnel Nexus',
      home: Scaffold(
        body: Center(child: Text('SlipTunnel Nexus')),
      ),
    );
  }
}
DART_EOF
          fi

      # Generates the three required Android source files only when absent so that
      # any files already present in the repository are preserved.
      - name: Generate Android Source Files if missing
        run: |
          # AndroidManifest.xml
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            mkdir -p android/app/src/main
            cat > android/app/src/main/AndroidManifest.xml << 'XML_EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
    <application
        android:label="SlipTunnel Nexus"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/Theme.AppCompat.Light.NoActionBar"
        android:dataExtractionRules="@xml/data_extraction_rules"
        android:fullBackupContent="false">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTop"
            android:theme="@style/Theme.AppCompat.Light.NoActionBar"
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
            android:hardwareAccelerated="true"
            android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>
XML_EOF
          fi

          # MainActivity.kt
          if [ ! -f "android/app/src/main/kotlin/com/argotunnel/MainActivity.kt" ]; then
            mkdir -p android/app/src/main/kotlin/com/argotunnel
            cat > android/app/src/main/kotlin/com/argotunnel/MainActivity.kt << 'KT_EOF'
package com.argotunnel

import io.flutter.embedding.android.FlutterActivity

class MainActivity : FlutterActivity()
KT_EOF
          fi

          # proguard-rules.pro (referenced in app/build.gradle.kts release block)
          if [ ! -f "android/app/proguard-rules.pro" ]; then
            cat > android/app/proguard-rules.pro << 'PRO_EOF'
-keep class io.flutter.** { *; }
-keep class io.flutter.embedding.** { *; }
-dontwarn io.flutter.embedding.**
-keep class com.argotunnel.** { *; }
-keepclassmembers class * {
    @android.webkit.JavascriptInterface <methods>;
}
PRO_EOF
          fi

      - name: Generate Flutter-Compatible Gradle Files
        run: |
          python3 << 'PYEOF'
          import os

          # gradle.properties
          with open('android/gradle.properties', 'w') as f:
              f.write('android.useAndroidX=true\n')
              f.write('android.enableJetifier=true\n')
              f.write('org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n')
              f.write('org.gradle.daemon=false\n')

          # settings.gradle.kts — Flutter-compatible
          # Uses $flutterSdkPath (Kotlin string interpolation) to locate Flutter's Gradle plugin.
          settings = (
              'pluginManagement {\n'
              '    val flutterSdkPath = run {\n'
              '        val properties = java.util.Properties()\n'
              '        file("local.properties").inputStream().use { properties.load(it) }\n'
              '        val flutterSdkPath = properties.getProperty("flutter.sdk")\n'
              '        require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }\n'
              '        flutterSdkPath\n'
              '    }\n'
              '    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")\n'
              '    repositories {\n'
              '        google()\n'
              '        mavenCentral()\n'
              '        gradlePluginPortal()\n'
              '    }\n'
              '}\n'
              'plugins {\n'
              '    id("dev.flutter.flutter-plugin-loader") version "1.0.0"\n'
              '    id("com.android.application") version "8.2.2" apply false\n'
              '    id("org.jetbrains.kotlin.android") version "1.9.22" apply false\n'
              '}\n'
              'include(":app")\n'
          )
          with open('android/settings.gradle.kts', 'w') as f:
              f.write(settings)

          # Root build.gradle.kts — empty; plugin versions declared in settings
          with open('android/build.gradle.kts', 'w') as f:
              f.write('// Root build file. Plugin versions are declared in settings.gradle.kts.\n')

          # app/build.gradle.kts
          # NOTE: externalNativeBuild is intentionally omitted. The native libraries
          # (libargotunnel_rust_core.so, libargotunnel_core.so) are pre-built and
          # placed in jniLibs/arm64-v8a/ by the download-artifact step above.
          # Android packages them automatically without requiring a CMake build.
          app_build = (
              'plugins {\n'
              '    id("com.android.application")\n'
              '    id("org.jetbrains.kotlin.android")\n'
              '    id("dev.flutter.flutter-gradle-plugin")\n'
              '}\n\n'
              'android {\n'
              '    namespace = "com.argotunnel"\n'
              '    compileSdk = 34\n'
              '    ndkVersion = "26.1.10909125"\n\n'
              '    defaultConfig {\n'
              '        applicationId = "com.argotunnel"\n'
              '        minSdk = 24\n'
              '        targetSdk = 34\n'
              '        versionCode = 1\n'
              '        versionName = "1.4.0-OMNI-FINAL"\n'
              '        ndk {\n'
              '            abiFilters.add("arm64-v8a")\n'
              '        }\n'
              '    }\n\n'
              '    buildTypes {\n'
              '        release {\n'
              '            isMinifyEnabled = true\n'
              '            proguardFiles(\n'
              '                getDefaultProguardFile("proguard-android-optimize.txt"),\n'
              '                "proguard-rules.pro"\n'
              '            )\n'
              '        }\n'
              '    }\n\n'
              '    compileOptions {\n'
              '        sourceCompatibility = JavaVersion.VERSION_17\n'
              '        targetCompatibility = JavaVersion.VERSION_17\n'
              '    }\n'
              '    kotlinOptions {\n'
              '        jvmTarget = "17"\n'
              '    }\n'
              '}\n\n'
              'flutter {\n'
              '    source = "../.."\n'
              '}\n\n'
              'dependencies {\n'
              '    implementation("androidx.core:core-ktx:1.12.0")\n'
              '    implementation("androidx.appcompat:appcompat:1.6.1")\n'
              '    implementation("com.google.android.material:material:1.11.0")\n'
              '    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")\n'
              '}\n'
          )
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(app_build)

          print("All Gradle files generated successfully.")
          PYEOF

      # FIX: local.properties must exist before ANY Gradle invocation because
      # settings.gradle.kts reads it during the configuration phase.
      - name: Write local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME"    >> android/local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> android/local.properties

      # FIX: The ubuntu-latest runner ships with Gradle 9.x as the system binary.
      # Gradle 9.x bundles Groovy 4.x, which removed groovy.xml.QName.
      # Flutter 3.19.x's flutter.groovy plugin imports groovy.xml.QName at line 8,
      # causing a compile failure during the Gradle configuration phase — even for
      # the `gradle wrapper` task itself.
      #
      # Solution: Download Gradle 8.6 directly and use its binary to generate the
      # wrapper. Gradle 8.x bundles Groovy 3.x, which is fully compatible with
      # Flutter 3.19's Groovy plugin. The system `gradle` binary is never invoked.
      - name: Install Gradle 8.6 and Generate Wrapper
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip \
            -o /tmp/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /tmp/gradle_install
          GRADLE_BIN=/tmp/gradle_install/gradle-8.6/bin/gradle

          cd android && $GRADLE_BIN wrapper --gradle-version 8.6

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-sliptunnel-nexus-release
          path: build/app/outputs/flutter-apk/app-release.apk
