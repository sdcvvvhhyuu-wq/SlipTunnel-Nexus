name: Nexus Omni-Build Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

env:
  # رفع هشدار مربوط به Node.js 20 و اجبار به استفاده از نسخه 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-core:
    name: Compile Go, Rust, and Zig Cores
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          # غیرفعال کردن کش برای دور زدن خطای 400 سرورهای گیت‌هاب
          cache: false

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.11.0

      - name: Build Rust Core (aarch64)
        run: |
          cd rust_core
          
          # استفاده از NDK پیش‌فرض سرور گیت‌هاب و حذف ابزار معیوب cargo-ndk
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
          
          # تزریق مستقیم مسیرها به مغز کارگو برای کامپایل بدون نقص کریت‌های C
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$AR
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CC
          export CC_aarch64_linux_android=$CC
          export CXX_aarch64_linux_android=$CXX
          
          # کامپایل مستقیم توسط خود راست بدون هیچ ابزار واسطه
          cargo build --target aarch64-linux-android --release

      - name: Build Zig Scrubber (aarch64)
        run: |
          cd zig_core
          zig build -Dtarget=aarch64-linux-android -Doptimize=ReleaseFast

      - name: Build Go Core (C-Shared)
        run: |
          cd core
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
          
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go build -buildmode=c-shared -o libargotunnel_core.so main.go

      - name: Upload Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries
          path: |
            rust_core/target/aarch64-linux-android/release/libargotunnel_rust_core.so
            core/libargotunnel_core.so
            core/libargotunnel_core.h

  build-android:
    name: Build Android APK
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Core Artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-libraries
          path: android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-sliptunnel-nexus-release
          path: android/app/build/outputs/apk/release/*.apk
